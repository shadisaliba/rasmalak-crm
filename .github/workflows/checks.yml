# Per-PR checks from the playbook (§2.6). Screenshots and blueprint IDs stay manual.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Lint, types, unit tests, i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # xlsx installs from the SheetJS CDN tarball, not the npm registry.
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run check:i18n

  supabase:
    name: Database tests, build, end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Users and password from supabase/seed.sql. They exist only in the local database.
      TEST_EMAIL: owner.a@example.test
      TEST_PASSWORD: Passw0rd!local
      TEST_NO_ORG_EMAIL: no.org@example.test
      TEST_NO_ORG_PASSWORD: Passw0rd!local
      TEST_INVITEE_EMAIL: join.me@example.test
      TEST_INVITEE_PASSWORD: Passw0rd!local
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Pinned to the version used locally; the CLI decides which service images start.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start local Supabase (applies migrations and seed.sql)
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: pgTAP
        run: supabase test db

      - name: Point the app and tests at local Supabase
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          cron_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$cron_secret"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "CRON_SECRET=$cron_secret"
            echo "NEXT_PUBLIC_APP_URL=$BASE_URL"
          } >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run build

      - name: Start the production server
        run: |
          nohup npx next start -p 3000 > "$RUNNER_TEMP/next.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -o /dev/null "$BASE_URL/login" && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/next.log"
          exit 1

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Keep the report and server log
        if: failure()
        run: cp "$RUNNER_TEMP/next.log" tests/report/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/report
            test-results
          retention-days: 14
